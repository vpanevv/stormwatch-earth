<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#1a1f27"/>
      <stop offset="1" stop-color="#040508"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="30%" r="78%">
      <stop offset="0" stop-color="#2c5d86"/>
      <stop offset=".45" stop-color="#143049"/>
      <stop offset=".8" stop-color="#08121d"/>
      <stop offset="1" stop-color="#05090f"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset=".86" stop-color="#7fb4ff" stop-opacity="0"/>
      <stop offset=".97" stop-color="#9cc6ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#9cc6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2=".35" y2="1">
      <stop offset="0" stop-color="#ffc184"/>
      <stop offset=".5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#e14d06"/>
    </linearGradient>
    <clipPath id="g"><circle cx="32" cy="32" r="17"/></clipPath>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="17" fill="url(#planet)"/>
  <!-- cyclone: two spiral arms around the eye -->
  <g clip-path="url(#g)" fill="none" stroke="#ece8e0" stroke-linecap="round">
    <path d="M32 26.2c6.4-.3 11.2 3.7 11.6 9.4" stroke-width="3" stroke-opacity=".9"/>
    <path d="M43.6 35.6c.4 6-4.2 10.6-10.4 11" stroke-width="2.2" stroke-opacity=".45"/>
    <path d="M32 37.8c-6.4.3-11.2-3.7-11.6-9.4" stroke-width="3" stroke-opacity=".9"/>
    <path d="M20.4 28.4c-.4-6 4.2-10.6 10.4-11" stroke-width="2.2" stroke-opacity=".45"/>
  </g>
  <circle cx="32" cy="32" r="17.6" fill="url(#rim)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#ece8e0" stroke-opacity=".55" stroke-width="1"/>
  <!-- radar-lock brackets -->
  <g fill="none" stroke="#ff7a1a" stroke-width="2.4" stroke-linecap="round">
    <path d="M12.6 20.2A23.5 23.5 0 0 1 20.2 12.6"/>
    <path d="M43.8 12.6a23.5 23.5 0 0 1 7.6 7.6"/>
    <path d="M51.4 43.8a23.5 23.5 0 0 1-7.6 7.6"/>
    <path d="M20.2 51.4a23.5 23.5 0 0 1-7.6-7.6"/>
  </g>
  <!-- the strike, from the eye -->
  <path d="M34.6 21.5 26.9 33.8h5.6l-2.6 9.8 9-14.2h-5.7l2.9-7.9Z" fill="url(#bolt)" stroke="#05070a" stroke-width="1.8" stroke-linejoin="round" paint-order="stroke"/>
</svg>
